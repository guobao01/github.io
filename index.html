<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>甲基化检测试剂盒获批情况统计</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --primary: #0ea5e9;
  --primary-light: #e0f2fe;
  --primary-soft: #7dd3fc;
  --primary-dark: #0284c7;
  --bg: #f0f9ff;
  --card-bg: #ffffff;
  --text: #0f172a;
  --text-secondary: #475569;
  --text-light: #94a3b8;
  --border: #e2e8f0;
  --shadow: 0 1px 3px rgba(14, 165, 233, 0.08), 0 1px 2px rgba(14, 165, 233, 0.04);
  --shadow-md: 0 4px 6px rgba(14, 165, 233, 0.08), 0 2px 4px rgba(14, 165, 233, 0.04);
  --radius: 16px;
  --radius-sm: 10px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ===== Header ===== */
.header {
  background: linear-gradient(135deg, #7dd3fc 0%, #38bdf8 50%, #0ea5e9 100%);
  color: #fff;
  padding: 48px 24px 72px;
  text-align: center;
  box-shadow: 0 4px 20px rgba(14, 165, 233, 0.25);
  position: relative;
}
.header-logo {
  display: inline-flex;
  align-items: flex-start;
  justify-content: center;
  gap: 16px;
  margin-bottom: 10px;
}
.header-logo svg {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  margin-top: 6px;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.12));
}
.header h1 {
  font-size: 40px;
  font-weight: 700;
  letter-spacing: 1px;
  line-height: 1.2;
  text-shadow: 0 2px 4px rgba(0,0,0,0.08);
  text-align: left;
}
.header p {
  font-size: 15px;
  opacity: 0.92;
  margin-top: 4px;
}
.header .update-time {
  position: absolute;
  top: 22px;
  right: 28px;
  font-size: 12px;
  opacity: 0.85;
  background: rgba(255,255,255,0.22);
  padding: 5px 16px;
  border-radius: 20px;
  backdrop-filter: blur(4px);
}

/* ===== Container ===== */
.container {
  width: 100%;
  max-width: 1800px;
  margin: 0 auto;
  padding: 0 24px 60px;
}

/* ===== Stats Cards ===== */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  margin: -52px 0 28px;
  position: relative;
  z-index: 1;
}
.stat-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 24px 20px;
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  gap: 16px;
  transition: transform 0.2s, box-shadow 0.2s;
  border: 1px solid rgba(14, 165, 233, 0.08);
}
.stat-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(14, 165, 233, 0.14);
}
.stat-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.stat-icon.blue { background: #e0f2fe; }
.stat-icon.teal { background: #dbeafe; }
.stat-icon.amber { background: #fef3c7; }
.stat-icon.purple { background: #ede9fe; }
.stat-value {
  font-size: 30px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}
.stat-label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* ===== Toolbar ===== */
.toolbar {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 18px 22px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
  border: 1px solid rgba(14, 165, 233, 0.08);
}
.search-box {
  flex: 1;
  min-width: 260px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 11px 14px 11px 40px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  font-family: inherit;
}
.search-box input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.12);
}
.search-box svg {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  width: 17px;
  height: 17px;
  color: var(--text-light);
}
.filter-select {
  padding: 11px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  background: #fff;
  cursor: pointer;
  outline: none;
  font-family: inherit;
  transition: border-color 0.2s;
  min-width: 150px;
}
.filter-select:focus { border-color: var(--primary); }
.refresh-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 11px 16px;
  border: 1px solid var(--primary);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  background: var(--primary-light);
  color: var(--primary-dark);
  cursor: pointer;
  outline: none;
  font-family: inherit;
  white-space: nowrap;
  transition: all 0.2s;
}
.refresh-btn:hover {
  background: var(--primary);
  color: #fff;
}
.refresh-btn svg {
  transition: transform 0.5s;
}
.refresh-btn:hover svg {
  transform: rotate(180deg);
}
.page-info {
  font-size: 14px;
  color: var(--text-secondary);
  margin-left: auto;
  white-space: nowrap;
}
.page-info span { font-weight: 600; color: var(--primary); }

/* ===== Detail Card ===== */
.detail-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 32px;
  margin-bottom: 20px;
  border: 1px solid rgba(14, 165, 233, 0.08);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}
.card-id {
  display: flex;
  align-items: center;
  gap: 12px;
}
.id-badge {
  background: var(--primary);
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
}
.card-date {
  font-size: 15px;
  color: var(--text-secondary);
  font-weight: 500;
}
.kit-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 24px;
  line-height: 1.5;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
}
.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 18px 28px;
  margin-bottom: 28px;
}
.info-item {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.info-label {
  font-size: 12px;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.info-value {
  font-size: 15px;
  color: var(--text);
  font-weight: 500;
}
.info-value.reg-no {
  font-family: "SF Mono", "Consolas", monospace;
  font-size: 14px;
  color: var(--text-secondary);
}
.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  width: fit-content;
}
.badge-cancer {
  background: var(--primary-light);
  color: var(--primary-dark);
}
.badge-report-yes {
  background: #dcfce7;
  color: #15803d;
}
.badge-report-no {
  background: #f1f5f9;
  color: var(--text-light);
}
.target-tag {
  display: inline-block;
  padding: 4px 12px;
  background: #f0fdf4;
  color: #166534;
  border-radius: 6px;
  font-size: 14px;
  font-family: "SF Mono", "Consolas", monospace;
  width: fit-content;
}

/* ===== Metrics Section ===== */
.metrics-section {
  background: linear-gradient(135deg, #f8fafc 0%, #f0f9ff 100%);
  border-radius: var(--radius-sm);
  padding: 24px;
  border: 1px solid var(--border);
}
.metrics-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 18px;
}
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}
.metric-item {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.metric-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.metric-name {
  font-size: 14px;
  color: var(--text-secondary);
}
.metric-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.metric-bar {
  width: 100%;
  height: 10px;
  background: #e2e8f0;
  border-radius: 5px;
  overflow: hidden;
}
.metric-bar-fill {
  height: 100%;
  border-radius: 5px;
  transition: width 0.6s ease;
}
.metric-bar-fill.high { background: linear-gradient(90deg, #10b981, #34d399); }
.metric-bar-fill.mid { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.metric-bar-fill.low { background: linear-gradient(90deg, #ef4444, #f87171); }
.metric-na {
  color: var(--text-light);
  font-size: 14px;
  font-style: italic;
}

/* ===== Pagination ===== */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  margin: 28px 0 36px;
}
.pagination button {
  padding: 11px 24px;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--primary);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  font-family: inherit;
}
.pagination button:hover:not(:disabled) {
  background: var(--primary-dark);
  transform: translateY(-1px);
}
.pagination button:disabled {
  background: #cbd5e1;
  cursor: not-allowed;
}
.page-indicator {
  font-size: 15px;
  color: var(--text-secondary);
  font-weight: 500;
  background: #fff;
  padding: 9px 20px;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.page-indicator span { color: var(--primary); font-weight: 700; }

/* ===== Charts Section ===== */
.charts-section {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 28px;
  border: 1px solid rgba(14, 165, 233, 0.08);
}
.section-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-title::before {
  content: '';
  width: 4px;
  height: 22px;
  background: var(--primary);
  border-radius: 2px;
}
.charts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
  gap: 28px;
}
.chart-card {
  background: #fff;
  border-radius: var(--radius-sm);
  padding: 20px;
  border: 1px solid var(--border);
}
.chart-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 16px;
  text-align: center;
}
.chart-container {
  position: relative;
  height: 320px;
}

/* ===== Table ===== */
.table-wrapper {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  border: 1px solid rgba(14, 165, 233, 0.08);
  margin-bottom: 20px;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.data-table thead {
  background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
}
.data-table th {
  padding: 14px 12px;
  text-align: left;
  font-weight: 600;
  color: var(--primary-dark);
  white-space: nowrap;
  border-bottom: 2px solid var(--primary-soft);
  position: sticky;
  top: 0;
  z-index: 10;
}
.data-table th.center { text-align: center; }
.data-table td {
  padding: 13px 12px;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: middle;
  color: var(--text);
}
.data-table tbody tr { transition: background 0.15s; }
.data-table tbody tr:hover { background: #f0f9ff; }
.data-table tbody tr:last-child td { border-bottom: none; }
.kit-name { font-weight: 500; max-width: 340px; }
.reg-no {
  font-family: "SF Mono", "Consolas", monospace;
  font-size: 12px;
  color: var(--text-secondary);
}
.metric-bar-mini {
  width: 50px;
  height: 6px;
  background: #f1f5f9;
  border-radius: 3px;
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
  margin-right: 6px;
}
.metric-bar-mini-fill {
  height: 100%;
  border-radius: 3px;
}
.metric-bar-mini-fill.high { background: #10b981; }
.metric-bar-mini-fill.mid { background: #f59e0b; }
.metric-bar-mini-fill.low { background: #ef4444; }
.metric-text {
  font-family: "SF Mono", "Consolas", monospace;
  font-size: 12px;
  font-weight: 500;
}
.metric-na { color: var(--text-light); font-size: 12px; }
.target-tag {
  display: inline-block;
  padding: 2px 8px;
  background: #f0fdf4;
  color: #166534;
  border-radius: 4px;
  font-size: 12px;
  font-family: "SF Mono", "Consolas", monospace;
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ===== Loading & Empty States ===== */
.loading {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-secondary);
}
.loading .spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  margin: 0 auto 14px;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-light);
}

/* ===== Footer ===== */
.footer {
  text-align: center;
  padding: 28px;
  font-size: 12px;
  color: var(--text-light);
}
.footer a {
  color: var(--primary);
  text-decoration: none;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .header { padding: 36px 20px 56px; }
  .header h1 { font-size: 26px; }
  .header-logo { gap: 10px; }
  .header-logo svg { width: 36px; height: 36px; margin-top: 4px; }
  .header .update-time { top: 14px; right: 16px; font-size: 11px; }
  .container { padding: 0 16px 40px; }
  .stats { grid-template-columns: repeat(2, 1fr); margin-top: -28px; gap: 12px; }
  .stat-card { padding: 16px 12px; gap: 12px; }
  .stat-icon { width: 44px; height: 44px; font-size: 20px; }
  .stat-value { font-size: 24px; }
  .toolbar { flex-direction: column; align-items: stretch; }
  .filter-select, .search-box { width: 100%; }
  .page-info { margin-left: 0; text-align: center; }
  .table-wrapper { overflow-x: auto; }
  .data-table { min-width: 1000px; }
  .kit-name { max-width: 180px; }
  .charts-grid { grid-template-columns: 1fr; }
  .chart-container { height: 260px; }
  .pagination { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="30" fill="rgba(255,255,255,0.2)"/>
      <circle cx="32" cy="32" r="24" fill="rgba(255,255,255,0.15)"/>
      <path d="M20 40 L20 24 M20 24 Q26 18 32 24 Q38 30 44 24 M20 32 Q26 26 32 32 Q38 38 44 32 M20 40 Q26 34 32 40 Q38 46 44 40"
            stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <circle cx="44" cy="24" r="3" fill="#fff"/>
      <circle cx="44" cy="32" r="3" fill="#fff"/>
      <circle cx="44" cy="40" r="3" fill="#fff"/>
    </svg>
    <div style="text-align:left;">
      <h1>甲基化检测试剂盒获批情况统计（含miRNA）</h1>
      <p>NMPA甲基化检测试剂盒注册审批数据汇总</p>
    </div>
  </div>
  <div class="update-time" id="updateTime"></div>
</div>

<div class="container">
  <!-- Stats Cards -->
  <div class="stats" id="statsCards">
    <div class="stat-card">
      <div class="stat-icon blue">📋</div>
      <div><div class="stat-value" id="statTotal">-</div><div class="stat-label">获批试剂盒总数</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon teal">🎯</div>
      <div><div class="stat-value" id="statCancers">-</div><div class="stat-label">覆盖癌种数量</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber">🏢</div>
      <div><div class="stat-value" id="statCompanies">-</div><div class="stat-label">获批企业数量</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon purple">📅</div>
      <div><div class="stat-value" id="statLatest" style="font-size:18px;">-</div><div class="stat-label">最近获批时间</div></div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="搜索试剂盒名称、公司、靶标、注册证编号...">
    </div>
    <select class="filter-select" id="filterCancer">
      <option value="">全部癌种</option>
    </select>
    <select class="filter-select" id="filterYear">
      <option value="">全部年份</option>
    </select>
    <select class="filter-select" id="filterSample">
      <option value="">全部样本类型</option>
    </select>
    <select class="filter-select" id="filterReport">
      <option value="">全部审评报告</option>
      <option value="有">有审评报告</option>
      <option value="无">无审评报告</option>
    </select>
    <button class="refresh-btn" onclick="refreshData()" title="重新加载最新数据">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      刷新数据
    </button>
    <div class="page-info" id="pageInfo"></div>
  </div>

  <!-- Detail Card -->
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    <div>正在加载数据...</div>
  </div>

  <div id="cardContainer" style="display:none;">
    <div class="table-wrapper">
      <table class="data-table">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <div style="font-size:48px; margin-bottom:12px;">🔍</div>
    <div>没有找到匹配的记录</div>
  </div>

  <!-- Pagination -->
  <div class="pagination" id="pagination" style="display:none;">
    <button id="btnFirst" onclick="goToPage(1)">首页</button>
    <button id="btnPrev" onclick="prevPage()">上一页</button>
    <div class="page-indicator">第 <span id="currentPage">1</span> / <span id="totalPages">1</span> 页</div>
    <button id="btnNext" onclick="nextPage()">下一页</button>
    <button id="btnLast" onclick="goToLastPage()">末页</button>
  </div>

  <!-- Charts -->
  <div class="charts-section" id="chartsSection" style="display:none;">
    <div class="section-title">统计数据</div>
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">不同年份获批试剂盒数量</div>
        <div class="chart-container"><canvas id="yearChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">不同癌症获批试剂盒数量</div>
        <div class="chart-container"><canvas id="cancerChart"></canvas></div>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  数据来源：NMPA 公开信息 · 自动同步自 GitHub 仓库 ·
  <a href="https://github.com" id="repoLink" target="_blank">查看仓库</a>
</div>

<script src="data.js"></script>
<script>
let rawData = { headers: [], data: [] };
let filteredData = [];
let currentPage = 1;
let itemsPerPage = 10;
let yearChartInstance = null;
let cancerChartInstance = null;

function loadData() {
  if (window.pageData && window.pageData.data) {
    rawData = window.pageData;
    initPage();
  } else {
    document.getElementById('loadingState').innerHTML =
      '<div style="color:#ef4444;">数据加载失败：未找到 data.js 文件。<br>请确保 data.js 与 index.html 在同一目录下。</div>';
  }
}

function initPage() {
  renderStats();
  renderFilters();
  applyFilters(false);
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('updateTime').textContent =
    '数据更新时间：' + new Date().toLocaleDateString('zh-CN');

  document.getElementById('searchInput').addEventListener('input', () => applyFilters(true));
  document.getElementById('filterCancer').addEventListener('change', () => applyFilters(true));
  document.getElementById('filterYear').addEventListener('change', () => applyFilters(true));
  document.getElementById('filterSample').addEventListener('change', () => applyFilters(true));
  document.getElementById('filterReport').addEventListener('change', () => applyFilters(true));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') prevPage();
    if (e.key === 'ArrowRight') nextPage();
  });
}

function renderStats() {
  const data = rawData.data;
  document.getElementById('statTotal').textContent = data.length;

  const cancers = new Set(data.map(r => normalizeCancer(r['目标癌种'])).filter(Boolean));
  document.getElementById('statCancers').textContent = cancers.size;

  const companies = new Set(data.map(r => r['公司名称']).filter(Boolean));
  document.getElementById('statCompanies').textContent = companies.size;

  let latest = '';
  let latestNum = 0;
  data.forEach(r => {
    const d = r['获批年月'] || '';
    const y = parseInt((d.match(/(\d{4})/) || [0,0])[1]);
    const m = parseInt((d.match(/(\d+)月/) || [0,0])[1]) || 0;
    const num = y * 100 + m;
    if (num > latestNum) { latestNum = num; latest = d; }
  });
  document.getElementById('statLatest').textContent = latest || '-';
}

function renderFilters() {
  const cancers = [...new Set(rawData.data.map(r => r['目标癌种']).filter(Boolean))].sort();
  const samples = [...new Set(rawData.data.map(r => r['样本类型']).filter(Boolean))].sort();
  const years = [...new Set(rawData.data.map(r => extractYear(r['获批年月'])).filter(Boolean))].sort();

  const cancerSel = document.getElementById('filterCancer');
  cancerSel.innerHTML = '<option value="">全部癌种</option>';
  cancers.forEach(c => { cancerSel.innerHTML += `<option value="${c}">${c}</option>`; });

  const yearSel = document.getElementById('filterYear');
  yearSel.innerHTML = '<option value="">全部年份</option>';
  years.forEach(y => { yearSel.innerHTML += `<option value="${y}">${y}年</option>`; });

  const sampleSel = document.getElementById('filterSample');
  sampleSel.innerHTML = '<option value="">全部样本类型</option>';
  samples.forEach(s => { sampleSel.innerHTML += `<option value="${s}">${s}</option>`; });
}

function applyFilters(resetPage) {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const cancer = document.getElementById('filterCancer').value;
  const year = document.getElementById('filterYear').value;
  const sample = document.getElementById('filterSample').value;
  const report = document.getElementById('filterReport').value;

  filteredData = rawData.data.filter(row => {
    if (cancer && row['目标癌种'] !== cancer) return false;
    if (year && extractYear(row['获批年月']) !== year) return false;
    if (sample && row['样本类型'] !== sample) return false;
    if (report && row['审评报告'] !== report) return false;
    if (search) {
      const haystack = [
        row['试剂盒名称'], row['公司名称'], row['靶标'],
        row['注册证编号'], row['目标癌种'], row['样本类型']
      ].join(' ').toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });

  if (resetPage) currentPage = 1;
  renderPage();
  renderCharts();
}

function renderPage() {
  const totalPages = Math.max(1, Math.ceil(filteredData.length / itemsPerPage));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  document.getElementById('currentPage').textContent = currentPage;
  document.getElementById('totalPages').textContent = totalPages;
  document.getElementById('pageInfo').innerHTML =
    filteredData.length > 0
      ? `第 ${(currentPage-1)*itemsPerPage+1}-${Math.min(currentPage*itemsPerPage, filteredData.length)} 条 / 共 <span>${filteredData.length}</span> 条`
      : `共 <span>0</span> 条记录`;

  document.getElementById('btnFirst').disabled = currentPage === 1;
  document.getElementById('btnPrev').disabled = currentPage === 1;
  document.getElementById('btnNext').disabled = currentPage === totalPages;
  document.getElementById('btnLast').disabled = currentPage === totalPages;

  if (filteredData.length === 0) {
    document.getElementById('cardContainer').style.display = 'none';
    document.getElementById('pagination').style.display = 'none';
    document.getElementById('chartsSection').style.display = 'none';
    document.getElementById('emptyState').style.display = '';
    return;
  }

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('cardContainer').style.display = '';
  document.getElementById('pagination').style.display = 'flex';
  document.getElementById('chartsSection').style.display = '';

  const start = (currentPage - 1) * itemsPerPage;
  const end = Math.min(start + itemsPerPage, filteredData.length);
  const pageData = filteredData.slice(start, end);
  renderTable(pageData);
}

const columnConfig = {
  '序号': { width: '50px', center: true },
  '获批年月': { width: '90px' },
  '试剂盒名称': { width: '', cls: 'kit-name' },
  '公司名称': { width: '160px' },
  '注册证编号': { width: '150px', cls: 'reg-no' },
  '目标癌种': { width: '110px', badge: 'cancer' },
  '样本类型': { width: '110px' },
  '靶标': { width: '140px', tag: true },
  '灵敏度': { width: '120px', metric: true },
  '特异性': { width: '120px', metric: true },
  '准确度': { width: '120px', metric: true },
  '审评报告': { width: '80px', badge: 'report', center: true }
};

function renderTable(pageData) {
  // Render header
  let headHtml = '<tr>';
  rawData.headers.forEach(h => {
    const cfg = columnConfig[h] || {};
    const cls = cfg.center ? ' class="center"' : '';
    const w = cfg.width ? ` style="width:${cfg.width};"` : '';
    headHtml += `<th${cls}${w}>${h}</th>`;
  });
  headHtml += '</tr>';
  document.getElementById('tableHead').innerHTML = headHtml;

  // Render body
  let bodyHtml = '';
  pageData.forEach(row => {
    bodyHtml += '<tr>';
    rawData.headers.forEach(h => {
      const cfg = columnConfig[h] || {};
      const val = row[h];
      const center = cfg.center ? ' style="text-align:center;"' : '';

      if (cfg.metric) {
        if (val != null && typeof val === 'number') {
          const pct = Math.round(val * 100);
          const cls = pct >= 90 ? 'high' : pct >= 80 ? 'mid' : 'low';
          bodyHtml += `<td${center}><span class="metric-bar-mini"><span class="metric-bar-mini-fill ${cls}" style="width:${pct}%"></span></span><span class="metric-text">${(val*100).toFixed(1)}%</span></td>`;
        } else {
          bodyHtml += `<td${center}><span class="metric-na">—</span></td>`;
        }
      } else if (cfg.badge === 'cancer') {
        bodyHtml += `<td><span class="badge badge-cancer">${val || '—'}</span></td>`;
      } else if (cfg.badge === 'report') {
        const cls = val === '有' ? 'badge-report-yes' : 'badge-report-no';
        bodyHtml += `<td${center}><span class="badge ${cls}">${val || '—'}</span></td>`;
      } else if (cfg.tag) {
        bodyHtml += `<td><span class="target-tag" title="${val || ''}">${val || '—'}</span></td>`;
      } else {
        const cls = cfg.cls ? ` class="${cfg.cls}"` : '';
        bodyHtml += `<td${cls}>${val != null ? val : '<span class="metric-na">—</span>'}</td>`;
      }
    });
    bodyHtml += '</tr>';
  });
  document.getElementById('tableBody').innerHTML = bodyHtml;
}

function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    renderPage();
  }
}

function nextPage() {
  const totalPages = Math.ceil(filteredData.length / itemsPerPage);
  if (currentPage < totalPages) {
    currentPage++;
    renderPage();
  }
}

function goToPage(page) {
  const totalPages = Math.ceil(filteredData.length / itemsPerPage);
  if (page >= 1 && page <= totalPages) {
    currentPage = page;
    renderPage();
  }
}

function goToLastPage() {
  const totalPages = Math.ceil(filteredData.length / itemsPerPage);
  currentPage = totalPages;
  renderPage();
}

function extractYear(dateStr) {
  const m = String(dateStr).match(/(\d{4})/);
  return m ? m[1] : null;
}

function normalizeCancer(cancer) {
  if (!cancer) return '';
  return String(cancer).replace(/[（(].*?[）)]/g, '').trim();
}

function renderCharts() {
  const data = filteredData.length > 0 ? filteredData : rawData.data;

  // Year chart
  const yearCounts = {};
  data.forEach(r => {
    const y = extractYear(r['获批年月']);
    if (y) yearCounts[y] = (yearCounts[y] || 0) + 1;
  });
  const years = Object.keys(yearCounts).sort();
  const yearValues = years.map(y => yearCounts[y]);

  // Cancer chart
  const cancerCounts = {};
  data.forEach(r => {
    const c = normalizeCancer(r['目标癌种']);
    if (c) cancerCounts[c] = (cancerCounts[c] || 0) + 1;
  });
  const cancers = Object.keys(cancerCounts).sort((a, b) => cancerCounts[b] - cancerCounts[a]);
  const cancerValues = cancers.map(c => cancerCounts[c]);

  const colors = [
    '#0ea5e9', '#8b5cf6', '#f59e0b', '#10b981', '#ec4899',
    '#6366f1', '#f97316', '#06b6d4', '#84cc16', '#e11d48',
    '#a855f7', '#14b8a6', '#eab308', '#3b82f6', '#ef4444'
  ];

  if (yearChartInstance) yearChartInstance.destroy();
  yearChartInstance = new Chart(document.getElementById('yearChart'), {
    type: 'line',
    data: {
      labels: years,
      datasets: [{
        label: '获批数量',
        data: yearValues,
        backgroundColor: 'rgba(14, 165, 233, 0.12)',
        borderColor: '#0ea5e9',
        borderWidth: 2.5,
        pointBackgroundColor: '#fff',
        pointBorderColor: '#0ea5e9',
        pointBorderWidth: 2,
        pointRadius: 5,
        pointHoverRadius: 7,
        pointHoverBackgroundColor: '#0ea5e9',
        pointHoverBorderColor: '#fff',
        tension: 0.3,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: { label: ctx => `${ctx.raw} 个` }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { stepSize: 1 },
          grid: { color: '#f1f5f9' }
        },
        x: {
          grid: { display: false }
        }
      }
    }
  });

  if (cancerChartInstance) cancerChartInstance.destroy();
  cancerChartInstance = new Chart(document.getElementById('cancerChart'), {
    type: 'bar',
    data: {
      labels: cancers,
      datasets: [{
        label: '获批数量',
        data: cancerValues,
        backgroundColor: cancers.map((_, i) => colors[i % colors.length]),
        borderRadius: 6,
        barPercentage: 0.6
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: { label: ctx => `${ctx.raw} 个` }
        }
      },
      scales: {
        x: {
          beginAtZero: true,
          ticks: { stepSize: 1 },
          grid: { color: '#f1f5f9' }
        },
        y: {
          grid: { display: false }
        }
      }
    }
  });
}

function refreshData() {
  // Remove old data.js script tag
  const oldScript = document.querySelector('script[src^="data.js"]');
  if (oldScript) oldScript.remove();

  // Load fresh data.js with cache-busting timestamp
  const newScript = document.createElement('script');
  newScript.src = 'data.js?t=' + Date.now();
  newScript.onload = () => {
    if (window.pageData && window.pageData.data) {
      rawData = window.pageData;
      currentPage = 1;
      // Reset search and filters
      document.getElementById('searchInput').value = '';
      // Rebuild filter dropdowns with new data
      renderFilters();
      // Re-render everything
      renderStats();
      applyFilters(false);
      // Visual feedback
      const btn = document.querySelector('.refresh-btn');
      if (btn) {
        const origHTML = btn.innerHTML;
        btn.innerHTML = '<span style="color:#10b981;font-weight:700;">✓ 已更新 (' + rawData.data.length + ' 条)</span>';
        setTimeout(() => { btn.innerHTML = origHTML; }, 2000);
      }
    } else {
      alert('刷新失败：data.js 数据格式异常');
    }
  };
  newScript.onerror = () => {
    alert('刷新失败：data.js 文件不存在。\n请确保已运行 watch.py 或 generate_data.py 生成最新数据。');
  };
  document.head.appendChild(newScript);
}

// Start
loadData();
</script>
